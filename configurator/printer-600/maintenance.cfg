#############################################################################################################
### MAINTENANCE_MODE for the V-Core 4.1 IDEX 600
###
### Puts the machine into a service position, in this order:
###
###   1. bed to mid height   (Z at half of the Z travel -- the bed drops away
###                           from the nozzles, so every later move gains
###                           clearance rather than losing it)
###   2. gantry to the front (Y at the front limit plus a margin)
###   3. both toolheads to the middle of the bed, spread symmetrically around
###      the centre by the carriages' safe_distance plus a margin -- both
###      nozzles reachable from the front, without violating safe_distance
###
### MAINTENANCE_MODE has no leading underscore, so Mainsail lists it as a
### button under Machine settings -> Macros. _MAINTENANCE_CENTER_TOOLHEADS is
### internal and stays hidden.
###
### INSTALLING IT
###
### Either add
###
###     [include RatOS/printers/v-core-4-1-idex-600/maintenance.cfg]
###
### to printer.cfg (below [include RatOS.cfg]) -- this file ships to the
### printer next to the printer definition, so it follows configurator
### updates -- or, on a machine that is not on the 600 printer type yet, paste
### the two sections below into printer.cfg directly.
###
### Everything here is ASCII on purpose: Klipper's config parser reads with the
### process locale, and a mis-decoded byte in a description is a startup error.
#############################################################################################################

[gcode_macro MAINTENANCE_MODE]
description: Service position: bed to mid height, gantry to the front, both toolheads centred.
variable_z_height: "auto"       # "auto" = half of the Z travel, or an absolute Z in mm
variable_y_position: "auto"     # "auto" = as far front as the Y limit allows, or an absolute Y in mm
variable_head_spacing: "auto"   # "auto" = dual_carriage safe_distance + 10, or a distance in mm
variable_front_margin: 5        # how far to stay off the front Y limit, in mm
gcode:
	# Refuse while a print is live. The moves below are unconditional and would
	# drive straight through the part.
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% if state in ('printing', 'paused') %}
		{action_raise_error("MAINTENANCE_MODE: a print is %s -- cancel it first." % state)}
	{% endif %}

	# config
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}
	{% set z_min = printer.toolhead.axis_minimum.z|float %}
	{% set z_max = printer.toolhead.axis_maximum.z|float %}
	{% set y_min = printer.toolhead.axis_minimum.y|float %}
	{% set y_max = printer.toolhead.axis_maximum.y|float %}

	# X centre. printable_x_max is what RatOS computed at startup with the
	# default toolhead active; toolhead.axis_maximum.x follows the *active*
	# carriage on an IDEX machine and would give 675 instead of 600 with T1
	# selected. Fall back to it only if RatOS never calculated the area.
	{% set printable_x_max = printer["gcode_macro RatOS"].printable_x_max|float %}
	{% if printable_x_max <= 0 %}
		{% set printable_x_max = printer.toolhead.axis_maximum.x|float %}
	{% endif %}
	{% set center_x = printable_x_max / 2 %}

	# 1. bed height
	{% set z_target = params.Z|default(z_height) %}
	{% if z_target|string|lower == 'auto' %}
		{% set z_target = z_max / 2 %}
	{% endif %}
	{% set z_target = [[z_target|float, z_min]|max, z_max]|min %}

	# 2. gantry position
	{% set y_target = params.Y|default(y_position) %}
	{% if y_target|string|lower == 'auto' %}
		{% set y_target = y_min + front_margin|float %}
	{% endif %}
	{% set y_target = [[y_target|float, y_min]|max, y_max]|min %}

	# 3. toolhead positions. Both carriages cannot sit on the centre line --
	# [dual_carriage] safe_distance is 60mm on this machine -- so they straddle
	# it. A SPACING below safe_distance would be refused by Klipper mid-move,
	# so it is raised here instead.
	{% if printer["dual_carriage"] is defined %}
		{% set safe_distance = printer.configfile.settings.dual_carriage.safe_distance|default(60, true)|float %}
		{% set spacing = params.SPACING|default(head_spacing) %}
		{% if spacing|string|lower == 'auto' %}
			{% set spacing = safe_distance + 10 %}
		{% endif %}
		{% set spacing = [spacing|float, safe_distance]|max %}

		{% set t0_min = printer.configfile.settings.stepper_x.position_min|float %}
		{% set t0_max = printer.configfile.settings.stepper_x.position_max|float %}
		{% set t1_min = printer.configfile.settings.dual_carriage.position_min|float %}
		{% set t1_max = printer.configfile.settings.dual_carriage.position_max|float %}
		{% set x_t0 = [[center_x - spacing / 2, t0_min]|max, t0_max]|min %}
		{% set x_t1 = [[center_x + spacing / 2, t1_min]|max, t1_max]|min %}
	{% endif %}

	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Moving to the service position.."

	# Absolute moves need a homed machine. MAYBE_HOME homes only what is
	# unhomed, so a warm printer does not re-home for nothing.
	MAYBE_HOME

	CACHE_TOOLHEAD_SETTINGS KEY="maintenance"
	SET_MACRO_TRAVEL_SETTINGS
	SAVE_GCODE_STATE NAME=_MAINTENANCE_MODE
	G90

	# bed first: it only ever increases the gap between nozzles and bed
	G0 Z{z_target} F{z_speed}

	# then the gantry, then the carriages
	G0 Y{y_target} F{speed}
	{% if printer["dual_carriage"] is defined %}
		_MAINTENANCE_CENTER_TOOLHEADS X0={x_t0} X1={x_t1}
	{% else %}
		G0 X{center_x} F{speed}
	{% endif %}

	M400
	RESTORE_GCODE_STATE NAME=_MAINTENANCE_MODE
	RESTORE_TOOLHEAD_SETTINGS KEY="maintenance"
	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Service position reached. Re-home (G28) after moving anything by hand."


[gcode_macro _MAINTENANCE_CENTER_TOOLHEADS]
description: Internal use only. Moves both IDEX carriages to X0/X1 and leaves the previously active one selected.
gcode:
	# Called as its own macro rather than inlined because a macro body is
	# rendered in full before its first line executes: read after MAYBE_HOME
	# has run, printer["dual_carriage"].carriage_1 is the state that the moves
	# below actually start from.
	{% set x0 = params.X0|float %}
	{% set x1 = params.X1|float %}
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
	{% set idex_mode = printer["dual_carriage"].carriage_1|lower %}

	# In copy or mirror mode the carriages move as a pair and PARK_TOOLHEAD is a
	# no-op, so drop back to single mode first. This has to happen after homing,
	# not before: RatOS' G28 resets the mode itself and puts copy or mirror back
	# on the way out. _IDEX_SINGLE leaves the default toolhead active, which is
	# what act_t has to reflect afterwards.
	{% if idex_mode == 'copy' or idex_mode == 'mirror' %}
		{% set act_t = default_toolhead %}
		_IDEX_SINGLE
	{% else %}
		{% set act_t = 1 if idex_mode == 'primary' else 0 %}
	{% endif %}

	# Park both carriages before closing in on the centre. Coming from their
	# parking positions (-73 / 673 on this machine) the inward moves cannot
	# trip safe_distance, whatever the carriages were doing before -- moving
	# them straight to the centre from an arbitrary pair of positions can.
	PARK_TOOLHEAD

	G90
	SET_DUAL_CARRIAGE CARRIAGE=0
	G0 X{x0} F{speed}
	SET_DUAL_CARRIAGE CARRIAGE=1
	G0 X{x1} F{speed}
	{% if act_t == 0 %}
		SET_DUAL_CARRIAGE CARRIAGE=0
	{% endif %}
	M400
