#############################################################################################################
### HEATING POWER IN WATTS
###
### The interface shows each heater's duty cycle as a percentage and has no
### field for watts. These sections turn the same duty cycle into power, using
### the heater_power sensor type from klippy/heater_power.py, and the interface
### then shows and graphs them next to the temperatures:
###
###   W_heater_bed, W_BED_VR, W_BED_HL, W_BED_HR   one per bed zone, 600W each
###   W_chamber                                    the chamber heater, 1500W
###   W_total                                      all five added up
###
### The W_ prefix keeps them together in the panel and puts the unit where it
### can be read, because the panel itself labels every sensor in degrees. A
### reading of "1850" on W_total means 1850 watts, not 1850 degrees.
###
### THE NUMBERS ARE DERIVED, NOT MEASURED. Nothing here senses current or mains
### voltage: it is rated power times the fraction of time the heater is on. An
### element that has aged, or a mains that sags when 3900W come on at once,
### moves the real figure without moving this one. Treat it as "what the
### printer is asking for", not as a meter reading.
###
### The totals cover the heaters named below and nothing else -- no steppers,
### no electronics, no hotends. Add the hotends to W_total's lists if you want
### them in; they are roughly 60-100W each and were left out because the
### question this answers is about the big loads.
###
### The ratings are the ones the machine was built with. If a zone is a
### different element, change rated_watts here -- that number is the only thing
### standing between duty cycle and the figure on screen.
#############################################################################################################

# Loads klippy/heater_power.py and registers the sensor type. It has to come
# before the sections that use it: Klipper resolves sensor_type when the
# section is parsed, and the factory is registered when this one is.
[heater_power]

[temperature_sensor W_heater_bed]
sensor_type: heater_power
heaters: heater_bed
rated_watts: 600

[temperature_sensor W_BED_VR]
sensor_type: heater_power
heaters: BED_VR
rated_watts: 600

[temperature_sensor W_BED_HL]
sensor_type: heater_power
heaters: BED_HL
rated_watts: 600

[temperature_sensor W_BED_HR]
sensor_type: heater_power
heaters: BED_HR
rated_watts: 600

[temperature_sensor W_chamber]
sensor_type: heater_power
heaters: chamber_heater
rated_watts: 1500

[temperature_sensor W_total]
sensor_type: heater_power
heaters: heater_bed, BED_VR, BED_HL, BED_HR, chamber_heater
rated_watts: 600, 600, 600, 600, 1500
