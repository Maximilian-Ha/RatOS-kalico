#############################################################################################################
### Service macros for the V-Core 4.1 IDEX 600
###
### The macros Mainsail lists as buttons (a leading underscore hides a macro,
### so the helpers at the bottom stay out of the list):
###
###   MAINTENANCE_MODE   bed to mid height, gantry to the front, both toolheads
###                      centred -- the position to work on the machine in
###   MAINTENANCE_END    the way back: re-home, gantry to the back, both
###                      toolheads parked
###   NOZZLE_CHANGE      presents one nozzle at the front, 200mm in from its
###                      parking position, heated to 300C, with a timeout
###   NOZZLE_CHANGE_END  heater off, timeout cancelled
###   LUBE_X/LUBE_Y/     guided greasing run for one axis: three stations to
###   LUBE_Z             apply grease at, then sweeps to spread it
###   LUBE_NEXT          continue the run at the next station
###   LUBE_ABORT         drop the run where it stands
###   LUBE_STATUS        when each axis was last greased, in print hours
###   LUBE_MARK          record a greasing you did by hand
###
### INSTALLING IT
###
### Either add
###
###     [include RatOS/printers/v-core-4-1-idex-600/maintenance.cfg]
###
### to printer.cfg (below [include RatOS.cfg]) -- this file ships to the
### printer next to the printer definition, so it follows configurator
### updates -- or, on a machine that is not on the 600 printer type yet, paste
### the sections below into printer.cfg directly.
###
### Everything here is ASCII on purpose: Klipper's config parser reads with the
### process locale, and a mis-decoded byte in a description is a startup error.
#############################################################################################################

[gcode_macro MAINTENANCE_MODE]
description: Service position: bed to mid height, gantry to the front, both toolheads centred.
variable_z_height: "auto"       # "auto" = half of the Z travel, or an absolute Z in mm
variable_y_position: "auto"     # "auto" = as far front as the Y limit allows, or an absolute Y in mm
variable_head_spacing: "auto"   # "auto" = dual_carriage safe_distance + 10, or a distance in mm
variable_front_margin: 5        # how far to stay off the front Y limit, in mm
gcode:
	# Refuse while a print is live. The moves below are unconditional and would
	# drive straight through the part.
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% if state in ('printing', 'paused') %}
		{action_raise_error("MAINTENANCE_MODE: a print is %s -- cancel it first." % state)}
	{% endif %}

	# X centre. printable_x_max is what RatOS computed at startup with the
	# default toolhead active; toolhead.axis_maximum.x follows the *active*
	# carriage on an IDEX machine and would give 675 instead of 600 with T1
	# selected. Fall back to it only if RatOS never calculated the area.
	{% set printable_x_max = printer["gcode_macro RatOS"].printable_x_max|float %}
	{% if printable_x_max <= 0 %}
		{% set printable_x_max = printer.toolhead.axis_maximum.x|float %}
	{% endif %}
	{% set center_x = printable_x_max / 2 %}

	# Toolhead positions. Both carriages cannot sit on the centre line --
	# [dual_carriage] safe_distance is 60mm on this machine -- so they straddle
	# it. A SPACING below safe_distance would be refused by Klipper mid-move,
	# so it is raised here instead.
	{% if printer["dual_carriage"] is defined %}
		{% set safe_distance = printer.configfile.settings.dual_carriage.safe_distance|default(60, true)|float %}
		{% set spacing = params.SPACING|default(head_spacing) %}
		{% if spacing|string|lower == 'auto' %}
			{% set spacing = safe_distance + 10 %}
		{% endif %}
		{% set spacing = [spacing|float, safe_distance]|max %}
		{% set x_t0 = center_x - spacing / 2 %}
		{% set x_t1 = center_x + spacing / 2 %}
	{% endif %}

	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Moving to the service position.."

	# Absolute moves need a homed machine. MAYBE_HOME homes only what is
	# unhomed, so a warm printer does not re-home for nothing.
	MAYBE_HOME

	CACHE_TOOLHEAD_SETTINGS KEY="maintenance"
	SET_MACRO_TRAVEL_SETTINGS
	SAVE_GCODE_STATE NAME=_MAINTENANCE_MODE

	_MAINTENANCE_APPROACH Z={params.Z|default(z_height)} Y={params.Y|default(y_position)}
	{% if printer["dual_carriage"] is defined %}
		_MAINTENANCE_POSITION_TOOLHEADS X0={x_t0} X1={x_t1}
	{% else %}
		G90
		G0 X{center_x} F{printer["gcode_macro RatOS"].macro_travel_speed|float * 60}
	{% endif %}

	M400
	RESTORE_GCODE_STATE NAME=_MAINTENANCE_MODE
	RESTORE_TOOLHEAD_SETTINGS KEY="maintenance"
	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Service position reached. MAINTENANCE_END puts the machine back."


[gcode_macro MAINTENANCE_END]
description: Ends the service position: re-homes, gantry to the back, both toolheads parked.
variable_z_clearance: 20        # Z the machine is left at, in mm
variable_back_margin: 15        # how far to stay off the back of the printable area, in mm
variable_max_hotend_temp: 60    # refuse to re-home above this hotend temperature, in C
gcode:
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% if state in ('printing', 'paused') %}
		{action_raise_error("MAINTENANCE_END: a print is %s -- this macro re-homes." % state)}
	{% endif %}

	# A hot nozzle oozes, and G28 Z takes its reference with the nozzle right
	# above the bed -- a drop hanging off it lands in that reference, and on the
	# bed. Refuse rather than home into that. TEMP_LIMIT= overrides it for one
	# call if you know the nozzle is clean.
	{% set limit = params.TEMP_LIMIT|default(max_hotend_temp)|float %}
	{% for heater in ('extruder', 'extruder1') %}
		{% if printer[heater] is defined and printer[heater].temperature|float > limit %}
			{action_raise_error(
				"MAINTENANCE_END: %s is at %.0fC. Run NOZZLE_CHANGE_END or "
				"TURN_OFF_HEATERS, let it drop below %.0fC, then run this again "
				"-- or pass TEMP_LIMIT= deliberately."
				% (heater, printer[heater].temperature|float, limit))}
		{% endif %}
	{% endfor %}

	# config
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}
	{% set printable_y_max = printer["gcode_macro RatOS"].printable_y_max|float %}
	{% if printable_y_max <= 0 %}
		{% set printable_y_max = printer.toolhead.axis_maximum.y|float %}
	{% endif %}
	{% set back_y = printable_y_max - back_margin|float %}
	{% set z_target = [[params.Z|default(z_clearance)|float, printer.toolhead.axis_minimum.z|float]|max,
		printer.toolhead.axis_maximum.z|float]|min %}

	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Leaving the service position.."

	# G28, not MAYBE_HOME: hands were on the machine, so whatever Klippy still
	# believes about the position is fiction. MAINTENANCE_MODE homes only what
	# is unhomed because nothing has been touched yet at that point.
	G28

	CACHE_TOOLHEAD_SETTINGS KEY="maintenance_end"
	SET_MACRO_TRAVEL_SETTINGS
	SAVE_GCODE_STATE NAME=_MAINTENANCE_END
	G90

	G0 Z{z_target} F{z_speed}
	G0 Y{back_y} F{speed}

	# Park both carriages by positioning them *at* their parking positions --
	# same helper as the service position, so the copy/mirror reset and the
	# safe_distance-proof move order are not written twice.
	{% if printer["dual_carriage"] is defined %}
		_MAINTENANCE_POSITION_TOOLHEADS X0={printer["gcode_macro T0"].parking_position|float} X1={printer["gcode_macro T1"].parking_position|float}
	{% endif %}

	M400
	RESTORE_GCODE_STATE NAME=_MAINTENANCE_END
	RESTORE_TOOLHEAD_SETTINGS KEY="maintenance_end"
	RATOS_ECHO PREFIX="MAINTENANCE" MSG="Homed, parked, ready to print."


[gcode_macro NOZZLE_CHANGE]
description: Presents one nozzle at the front, heated, for a nozzle change. Run NOZZLE_CHANGE_END when done.
variable_temperature: 300           # nozzle temperature for the change, in C
variable_distance_from_parking: 200 # how far the presented carriage comes in from its parking position, in mm
variable_timeout: 900               # heater switches itself off after this many seconds unattended
variable_tool: -1                   # internal use only. Do not touch! Which heater the timeout owns.
gcode:
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% if state in ('printing', 'paused') %}
		{action_raise_error("NOZZLE_CHANGE: a print is %s -- cancel it first." % state)}
	{% endif %}
	{% if printer["dual_carriage"] is not defined %}
		{action_raise_error("NOZZLE_CHANGE: this macro is written for the IDEX machine.")}
	{% endif %}

	# Which toolhead: T= if given, otherwise the one that is active now. In copy
	# or mirror mode there is no single active carriage, so the default toolhead
	# stands in -- the same one _IDEX_SINGLE would leave selected.
	{% set idex_mode = printer["dual_carriage"].carriage_1|lower %}
	{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
	{% if idex_mode == 'copy' or idex_mode == 'mirror' %}
		{% set active_t = default_toolhead %}
	{% else %}
		{% set active_t = 1 if idex_mode == 'primary' else 0 %}
	{% endif %}
	{% set t = params.T|default(active_t)|int %}
	{% if t not in (0, 1) %}
		{action_raise_error("NOZZLE_CHANGE: T must be 0 or 1, got '%s'." % params.T)}
	{% endif %}

	{% set temp = params.TEMP|default(temperature)|float %}
	{% set distance = params.DISTANCE|default(distance_from_parking)|float %}
	{% set heater = 'extruder' if t == 0 else 'extruder1' %}

	# Targets: the presented carriage comes in from its own parking position --
	# T0 parks left and moves right, T1 parks right and moves left -- and the
	# other one stays parked. Not the bed centre: 200mm in is at the near corner
	# of the frame, where you can actually get a wrench in.
	{% set p0 = printer["gcode_macro T0"].parking_position|float %}
	{% set p1 = printer["gcode_macro T1"].parking_position|float %}
	{% set t0_min = printer.configfile.settings.stepper_x.position_min|float %}
	{% set t0_max = printer.configfile.settings.stepper_x.position_max|float %}
	{% set t1_min = printer.configfile.settings.dual_carriage.position_min|float %}
	{% set t1_max = printer.configfile.settings.dual_carriage.position_max|float %}
	{% set x_t0 = [[(p0 + distance) if t == 0 else p0, t0_min]|max, t0_max]|min %}
	{% set x_t1 = [[(p1 - distance) if t == 1 else p1, t1_min]|max, t1_max]|min %}

	# Filament in the nozzle at 300C is a mess, not a hazard -- say so, do not
	# refuse. Someone doing a hot pull wants exactly this.
	{% set sensor = "filament_switch_sensor toolhead_filament_sensor_t%d" % t %}
	{% if printer[sensor] is defined and printer[sensor].filament_detected|lower == 'true' %}
		RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="WARNING: filament is still loaded in T{t}. UNLOAD_FILAMENT first unless you mean to pull it hot."
	{% endif %}

	RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="Presenting T{t} and heating it to {temp|int}C.."

	# Home cold, then heat: G28 Z takes its reference right above the bed, and a
	# nozzle that is on its way to 300C drips into it.
	MAYBE_HOME
	SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}

	CACHE_TOOLHEAD_SETTINGS KEY="nozzle_change"
	SET_MACRO_TRAVEL_SETTINGS
	SAVE_GCODE_STATE NAME=_NOZZLE_CHANGE

	_MAINTENANCE_APPROACH Z={params.Z|default(printer["gcode_macro MAINTENANCE_MODE"].z_height)} Y={params.Y|default(printer["gcode_macro MAINTENANCE_MODE"].y_position)}
	_MAINTENANCE_POSITION_TOOLHEADS X0={x_t0} X1={x_t1}

	M400
	RESTORE_GCODE_STATE NAME=_NOZZLE_CHANGE
	RESTORE_TOOLHEAD_SETTINGS KEY="nozzle_change"

	# The heater is only worth waiting for once the machine has stopped moving.
	TEMPERATURE_WAIT SENSOR={heater} MINIMUM={(temp - 5)|int}

	# Arm the dead man's switch. Klipper's own idle_timeout is two hours in
	# RatOS -- far too long to leave 300C unattended because someone walked away
	# mid-change.
	SET_GCODE_VARIABLE MACRO=NOZZLE_CHANGE VARIABLE=tool VALUE={t}
	UPDATE_DELAYED_GCODE ID=_NOZZLE_CHANGE_TIMEOUT DURATION={timeout|int}

	RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="T{t} is at {temp|int}C at X{(x_t0 if t == 0 else x_t1)|int}. Run NOZZLE_CHANGE_END when done -- the heater switches off by itself in {(timeout|int / 60)|int} minutes."


[gcode_macro NOZZLE_CHANGE_END]
description: Turns the nozzle-change heater off again and cancels its timeout.
gcode:
	{% set t = printer["gcode_macro NOZZLE_CHANGE"].tool|int %}

	UPDATE_DELAYED_GCODE ID=_NOZZLE_CHANGE_TIMEOUT DURATION=0
	{% if t in (0, 1) %}
		SET_HEATER_TEMPERATURE HEATER={'extruder' if t == 0 else 'extruder1'} TARGET=0
		SET_GCODE_VARIABLE MACRO=NOZZLE_CHANGE VARIABLE=tool VALUE=-1
		RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="T{t} heater off. After an actual nozzle swap, recalibrate: the Z offset and the beacon reference belong to the nozzle that left."
	{% else %}
		RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="No nozzle change is active."
	{% endif %}


#############################################################################################################
### GUIDED LUBRICATION
###
### LUBE_X / LUBE_Y / LUBE_Z walk one axis through three stations -- one end,
### the middle, the other end -- and stop at each so you can grease the rails.
### LUBE_NEXT continues (the Mainsail dialog's "Continue" button sends exactly
### that command), LUBE_ABORT drops the run. After the last station the axis
### sweeps its full travel a few times to spread the grease, ending back where
### the run started.
###
### Every position is derived from the axis limits, so this works on any size
### -- nothing here is a 600 number.
#############################################################################################################

[gcode_macro LUBE_Z]
description: Guided greasing run for the Z rails: bed to the top, the middle, the bottom, then sweeps.
gcode:
	_LUBE_START AXIS=Z

[gcode_macro LUBE_X]
description: Guided greasing run for the X rail: both toolheads left, centre, right, then sweeps.
gcode:
	_LUBE_START AXIS=X

[gcode_macro LUBE_Y]
description: Guided greasing run for the Y rails: gantry front, middle, back, then sweeps.
gcode:
	_LUBE_START AXIS=Y

[gcode_macro LUBE_NEXT]
description: Continues a lubrication run after you have applied grease at the current station.
gcode:
	{% if printer["gcode_macro _LUBE_START"].axis == '' %}
		RATOS_ECHO PREFIX="LUBE" MSG="No lubrication run in progress. Start one with LUBE_Z, LUBE_X or LUBE_Y."
	{% else %}
		_LUBE_ADVANCE
	{% endif %}

[gcode_macro LUBE_ABORT]
description: Drops a lubrication run where it stands. Nothing moves; the axis is left at the current station.
gcode:
	{% set axis = printer["gcode_macro _LUBE_START"].axis %}
	_LUBE_CLEAR
	RESPOND TYPE=command MSG="action:prompt_end"
	{% if axis == '' %}
		RATOS_ECHO PREFIX="LUBE" MSG="No lubrication run in progress."
	{% else %}
		RATOS_ECHO PREFIX="LUBE" MSG="{axis} lubrication run dropped. The axis is wherever the last station left it -- MAINTENANCE_END puts the machine back."
	{% endif %}


#############################################################################################################
### LUBRICATION RECORD
###
### LUBE_STATUS answers "when did I last grease this, and how much printing has
### happened since". The unit is PRINT HOURS, not calendar time: a machine that
### stood still for a month has not worn its rails.
###
### Klipper has no clock -- a macro's whole world is `printer`, the action_*
### helpers and `math`, and print_stats counts only the job in progress. So the
### hours are accumulated here, by a delayed_gcode that samples print_duration
### and persists the total with SAVE_VARIABLE. The calendar date, which no macro
### can read, is written and read back by two shell commands; it is displayed,
### never computed with.
###
### Persisted in save_variables (the configurator writes [save_variables] into
### printer.cfg, and RatOS keeps filament state there the same way):
###
###   lube_print_hours   lifetime print hours of this machine, as counted here
###   lube_x_at          the value of that counter when X was last greased
###   lube_y_at / lube_z_at   likewise
#############################################################################################################

[gcode_macro LUBE_STATUS]
description: Shows when each axis was last greased and how many print hours ago that was.
variable_interval_hours: 100   # print hours between greasings. A placeholder: set it to what your rails want.
variable_show_dates: True      # False if you removed the [gcode_shell_command] sections below
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set pending = printer["gcode_macro _LUBE_HOURS"].unsaved|float / 3600 %}
	{% set total = (svv.lube_print_hours|default(0)|float) + pending %}
	{% set interval = interval_hours|float %}

	RATOS_ECHO PREFIX="LUBE" MSG="Print hours on this machine: {total|round(1)}"
	{% for ax in ('X', 'Y', 'Z') %}
		{% set key = 'lube_' ~ ax|lower ~ '_at' %}
		{% if key in svv and svv[key] is not none %}
			{% set since = total - svv[key]|float %}
			{% if interval > 0 %}
				{% set left = interval - since %}
				{% set verdict = "%.1f h to go" % left if left > 0 else "OVERDUE by %.1f h" % (-left) %}
			{% else %}
				{% set verdict = "no interval set" %}
			{% endif %}
			RATOS_ECHO PREFIX="LUBE" MSG="{ax}: greased at {svv[key]|float|round(1)} h -- {since|round(1)} print hours ago ({verdict})"
		{% else %}
			RATOS_ECHO PREFIX="LUBE" MSG="{ax}: never greased, or the record was lost. LUBE_{ax} runs it, LUBE_MARK AXIS={ax} records one you did by hand."
		{% endif %}
	{% endfor %}
	{% if show_dates %}
		# The dates come back as console output from the shell, because a macro
		# cannot read a clock and cannot capture a command's output either.
		RUN_SHELL_COMMAND CMD=lube_dates
	{% endif %}


[gcode_macro LUBE_MARK]
description: Records a greasing you did by hand. AXIS=X|Y|Z or ALL.
gcode:
	{% set ax = params.AXIS|default('')|upper %}
	{% if ax not in ('X', 'Y', 'Z', 'ALL') %}
		{action_raise_error("LUBE_MARK: AXIS must be X, Y, Z or ALL, got '%s'." % params.AXIS|default(''))}
	{% endif %}
	# Fold the unsaved seconds into the total first, so the snapshot is taken
	# against the number LUBE_STATUS will show, not the last one written to disk.
	_LUBE_HOURS FLUSH=1
	{% if ax == 'ALL' %}
		_LUBE_RECORD AXIS=X
		_LUBE_RECORD AXIS=Y
		_LUBE_RECORD AXIS=Z
	{% else %}
		_LUBE_RECORD AXIS={ax}
	{% endif %}

[delayed_gcode _NOZZLE_CHANGE_TIMEOUT]
gcode:
	{% set t = printer["gcode_macro NOZZLE_CHANGE"].tool|int %}
	{% if t in (0, 1) %}
		SET_HEATER_TEMPERATURE HEATER={'extruder' if t == 0 else 'extruder1'} TARGET=0
		SET_GCODE_VARIABLE MACRO=NOZZLE_CHANGE VARIABLE=tool VALUE=-1
		RATOS_ECHO PREFIX="NOZZLE CHANGE" MSG="Timeout reached with nobody around -- T{t} heater switched off."
	{% endif %}


[gcode_macro _MAINTENANCE_APPROACH]
description: Internal use only. Bed to Z (default mid height), gantry to Y (default front).
gcode:
	# Z first, and only ever Z first: it is the one axis whose move increases
	# the gap between nozzles and bed, so everything after it starts with
	# clearance instead of spending it.
	{% set z_min = printer.toolhead.axis_minimum.z|float %}
	{% set z_max = printer.toolhead.axis_maximum.z|float %}
	{% set y_min = printer.toolhead.axis_minimum.y|float %}
	{% set y_max = printer.toolhead.axis_maximum.y|float %}
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}
	{% set front_margin = printer["gcode_macro MAINTENANCE_MODE"].front_margin|float %}

	{% set z_target = params.Z|default('auto') %}
	{% if z_target|string|lower == 'auto' %}
		{% set z_target = z_max / 2 %}
	{% endif %}
	{% set z_target = [[z_target|float, z_min]|max, z_max]|min %}

	{% set y_target = params.Y|default('auto') %}
	{% if y_target|string|lower == 'auto' %}
		{% set y_target = y_min + front_margin %}
	{% endif %}
	{% set y_target = [[y_target|float, y_min]|max, y_max]|min %}

	G90
	G0 Z{z_target} F{z_speed}
	G0 Y{y_target} F{speed}


[gcode_macro _MAINTENANCE_POSITION_TOOLHEADS]
description: Internal use only. Moves both IDEX carriages to X0/X1 and leaves the previously active one selected.
gcode:
	# Called as its own macro rather than inlined because a macro body is
	# rendered in full before its first line executes: read after MAYBE_HOME or
	# G28 has run, printer["dual_carriage"].carriage_1 is the state that the
	# moves below actually start from.
	{% set x0 = params.X0|float %}
	{% set x1 = params.X1|float %}
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set default_toolhead = printer["gcode_macro RatOS"].default_toolhead|default(0)|int %}
	{% set idex_mode = printer["dual_carriage"].carriage_1|lower %}

	# In copy or mirror mode the carriages move as a pair and PARK_TOOLHEAD is a
	# no-op, so drop back to single mode first. This has to happen after homing,
	# not before: RatOS' G28 resets the mode itself and puts copy or mirror back
	# on the way out. _IDEX_SINGLE leaves the default toolhead active, which is
	# what act_t has to reflect afterwards.
	{% if idex_mode == 'copy' or idex_mode == 'mirror' %}
		{% set act_t = default_toolhead %}
		_IDEX_SINGLE
	{% else %}
		{% set act_t = 1 if idex_mode == 'primary' else 0 %}
	{% endif %}

	# Park both carriages before moving them to their targets. Coming from their
	# parking positions (-73 / 673 on this machine) the inward moves cannot trip
	# safe_distance, whatever the carriages were doing before -- moving them
	# straight there from an arbitrary pair of positions can.
	PARK_TOOLHEAD

	G90
	SET_DUAL_CARRIAGE CARRIAGE=0
	G0 X{x0} F{speed}
	SET_DUAL_CARRIAGE CARRIAGE=1
	G0 X{x1} F{speed}
	{% if act_t == 0 %}
		SET_DUAL_CARRIAGE CARRIAGE=0
	{% endif %}
	M400


[gcode_macro _LUBE_START]
description: Internal use only. Sets up a lubrication run for AXIS and drives to the first station.
variable_axis: ""        # internal use only. Do not touch! The run in progress, "" when idle.
variable_stations: []    # internal use only. Do not touch! Positions still to visit.
variable_total: 0        # internal use only. Do not touch! For the "station N of M" line.
variable_travel: []      # internal use only. Do not touch! [near, far] for the closing sweeps.
variable_margin: 10      # how far to stay off each end of the travel, in mm
variable_sweeps: 2       # full-travel passes at the end, to spread the grease
variable_move_delay: 3   # seconds of warning before every move, so hands can come out
gcode:
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% if state in ('printing', 'paused') %}
		{action_raise_error("LUBE: a print is %s -- cancel it first." % state)}
	{% endif %}
	{% set ax = params.AXIS|default('')|upper %}
	{% if ax not in ('X', 'Y', 'Z') %}
		{action_raise_error("LUBE: AXIS must be X, Y or Z, got '%s'." % params.AXIS|default(''))}
	{% endif %}
	{% if axis != '' %}
		{action_raise_error(
			"LUBE: a %s run is already in progress. Continue it with LUBE_NEXT, "
			"or drop it with LUBE_ABORT." % axis)}
	{% endif %}
	{% if ax == 'X' and printer["dual_carriage"] is not defined %}
		{action_raise_error("LUBE: the X run is written for the IDEX machine.")}
	{% endif %}

	# config
	{% set margin = margin|float %}
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set printable_y_max = printer["gcode_macro RatOS"].printable_y_max|float %}
	{% if printable_y_max <= 0 %}
		{% set printable_y_max = printer.toolhead.axis_maximum.y|float %}
	{% endif %}

	# The three stations, derived from the axis limits -- nothing here is a 600
	# number, so this works on any size.
	{% if ax == 'Z' %}
		# Z is the nozzle-to-bed distance: SMALL Z means the bed is at the top.
		# The near end is measured from 0 rather than from axis_minimum, because
		# below 0 is probe territory and not where a hand with a brush belongs.
		{% set near = [printer.toolhead.axis_minimum.z|float, 0]|max + margin %}
		{% set far = printer.toolhead.axis_maximum.z|float - margin %}
	{% elif ax == 'Y' %}
		{% set near = printer.toolhead.axis_minimum.y|float + margin %}
		# printable_y_max, not axis_maximum: the last stretch of Y travel is
		# where the VAOC camera sits, and it is reached deliberately or not at all.
		{% set far = printable_y_max - margin %}
	{% else %}
		# A station is the LEFT carriage's position; the right one follows it a
		# safe_distance behind, so the pair moves as a block.
		{% set safe_distance = printer.configfile.settings.dual_carriage.safe_distance|default(60, true)|float %}
		{% set spacing = safe_distance + 10 %}
		{% set near = printer.configfile.settings.stepper_x.position_min|float + margin %}
		{% set far = printer.configfile.settings.dual_carriage.position_max|float - margin - spacing %}
	{% endif %}
	{% set mid = (near + far) / 2 %}

	RATOS_ECHO PREFIX="LUBE" MSG="Starting the {ax} run. Homing, then moving to the first station."
	MAYBE_HOME

	# Get everything that is not the axis under work out of the way.
	{% if ax == 'Z' %}
		# Gantry to the back and both carriages parked: the bed and its rails are
		# what you need to reach, and they are reached from the front.
		G90
		G0 Y{printable_y_max - 15} F{speed}
		_MAINTENANCE_POSITION_TOOLHEADS X0={printer["gcode_macro T0"].parking_position|float} X1={printer["gcode_macro T1"].parking_position|float}
	{% else %}
		# Bed down to mid height, gantry to the front: room to reach in.
		_MAINTENANCE_APPROACH Z=auto Y=auto
		{% if ax == 'Y' %}
			_MAINTENANCE_POSITION_TOOLHEADS X0={printer["gcode_macro T0"].parking_position|float} X1={printer["gcode_macro T1"].parking_position|float}
		{% endif %}
	{% endif %}

	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=axis VALUE="'{ax}'"
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=stations VALUE="{[near, mid, far]}"
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=total VALUE=3
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=travel VALUE="{[near, far]}"
	_LUBE_ADVANCE


[gcode_macro _LUBE_ADVANCE]
description: Internal use only. Moves to the next station of the running lubrication run, or finishes it.
gcode:
	# Rendered at call time, after _LUBE_START's SET_GCODE_VARIABLE lines have
	# executed -- which is the only reason it can see the run it is advancing.
	{% set state = printer["gcode_macro _LUBE_START"] %}
	{% set ax = state.axis %}
	{% set stations = state.stations %}
	{% set total = state.total|int %}
	{% set delay = state.move_delay|float %}

	{% if ax == '' %}
		{action_raise_error("_LUBE_ADVANCE: no lubrication run in progress.")}
	{% endif %}

	{% if stations|length == 0 %}
		_LUBE_FINISH
	{% else %}
		{% set target = stations[0]|float %}
		{% set n = total - stations|length + 1 %}
		RATOS_ECHO PREFIX="LUBE" MSG="Station {n} of {total}: moving {ax} to {target|round(1)} in {delay|int}s. Hands clear."
		G4 P{(delay * 1000)|int}
		_LUBE_MOVE AXIS={ax} POS={target}
		SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=stations VALUE="{stations[1:]}"
		_LUBE_PROMPT AXIS={ax} STATION={n} TOTAL={total} POS={target|round(1)}
	{% endif %}


[gcode_macro _LUBE_FINISH]
description: Internal use only. Sweeps the axis to spread the grease and ends the run.
gcode:
	{% set state = printer["gcode_macro _LUBE_START"] %}
	{% set ax = state.axis %}
	{% set travel = state.travel %}
	{% set sweeps = state.sweeps|int %}
	{% set delay = state.move_delay|float %}
	{% set near = travel[0]|float %}
	{% set far = travel[1]|float %}

	RATOS_ECHO PREFIX="LUBE" MSG="Last station done. {sweeps} full-travel sweeps to spread it, starting in {delay|int}s. Hands clear."
	G4 P{(delay * 1000)|int}
	{% for _ in range(sweeps) %}
		_LUBE_MOVE AXIS={ax} POS={far}
		_LUBE_MOVE AXIS={ax} POS={near}
	{% endfor %}

	# Fold the seconds counted since the last write into the total first, so the
	# snapshot is taken against the number LUBE_STATUS will show.
	_LUBE_HOURS FLUSH=1
	_LUBE_RECORD AXIS={ax}

	_LUBE_CLEAR
	RESPOND TYPE=command MSG="action:prompt_end"
	RATOS_ECHO PREFIX="LUBE" MSG="{ax} run finished, back at {near|round(1)}. MAINTENANCE_END puts the machine back to a printable state."


[gcode_macro _LUBE_MOVE]
description: Internal use only. Moves one axis to POS, with the IDEX pair kept a safe_distance apart.
gcode:
	{% set ax = params.AXIS %}
	{% set pos = params.POS|float %}
	{% set speed = printer["gcode_macro RatOS"].macro_travel_speed|float * 60 %}
	{% set z_speed = printer["gcode_macro RatOS"].macro_z_speed|float * 60 %}

	G90
	{% if ax == 'Z' %}
		G0 Z{pos} F{z_speed}
	{% elif ax == 'Y' %}
		G0 Y{pos} F{speed}
	{% else %}
		# Both carriages, as a block. This goes through
		# _MAINTENANCE_POSITION_TOOLHEADS, which parks them first: that costs a
		# traverse per station, and buys not having to know where they were --
		# moving a pair to new positions in the wrong order trips safe_distance.
		# On the sweeps the extra traverse is not even waste; it spreads grease.
		{% set safe_distance = printer.configfile.settings.dual_carriage.safe_distance|default(60, true)|float %}
		{% set spacing = safe_distance + 10 %}
		{% set t0_min = printer.configfile.settings.stepper_x.position_min|float %}
		{% set t0_max = printer.configfile.settings.stepper_x.position_max|float %}
		{% set t1_min = printer.configfile.settings.dual_carriage.position_min|float %}
		{% set t1_max = printer.configfile.settings.dual_carriage.position_max|float %}
		{% set x0 = [[pos, t0_min]|max, t0_max]|min %}
		{% set x1 = [[pos + spacing, t1_min]|max, t1_max]|min %}
		_MAINTENANCE_POSITION_TOOLHEADS X0={x0} X1={x1}
	{% endif %}
	M400


[gcode_macro _LUBE_CLEAR]
description: Internal use only. Forgets the run in progress.
gcode:
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=axis VALUE="''"
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=stations VALUE="[]"
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=travel VALUE="[]"
	SET_GCODE_VARIABLE MACRO=_LUBE_START VARIABLE=total VALUE=0


[gcode_macro _LUBE_PROMPT]
description: Internal use only. Draws the Mainsail dialog with the Continue button.
gcode:
	# action:prompt_* is the frontend dialog protocol Mainsail and Fluidd
	# implement. On anything that does not, these lines are just console output
	# and LUBE_NEXT typed by hand does the same job -- nothing depends on the
	# dialog existing.
	{% set ax = params.AXIS %}
	{% set n = params.STATION|int %}
	{% set total = params.TOTAL|int %}
	{% set pos = params.POS %}
	{% set delay = printer["gcode_macro _LUBE_START"].move_delay|int %}
	{% set words = {
		'Z': ['bed at the top', 'bed at mid height', 'bed at the bottom'],
		'Y': ['gantry at the front', 'gantry at mid travel', 'gantry at the back'],
		'X': ['toolheads at the left end', 'toolheads centred', 'toolheads at the right end']} %}
	{% set where = words[ax][n - 1] if n <= words[ax]|length else ax ~ pos %}

	RESPOND TYPE=command MSG="action:prompt_end"
	RESPOND TYPE=command MSG="action:prompt_begin Lubrication: {ax} axis"
	RESPOND TYPE=command MSG="action:prompt_text Station {n} of {total}: {where} ({ax}{pos}). Grease the exposed rail, then keep clear -- Continue moves the axis after a {delay}s warning."
	RESPOND TYPE=command MSG="action:prompt_footer_button Continue|LUBE_NEXT|primary"
	RESPOND TYPE=command MSG="action:prompt_footer_button Abort|LUBE_ABORT|error"
	RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LUBE_RECORD]
description: Internal use only. Stamps AXIS as greased at the current print-hour count.
gcode:
	{% set ax = params.AXIS|upper %}
	{% set total = printer.save_variables.variables.lube_print_hours|default(0)|float %}
	SAVE_VARIABLE VARIABLE=lube_{ax|lower}_at VALUE={total|round(3)}
	{% if printer["gcode_macro LUBE_STATUS"].show_dates %}
		RUN_SHELL_COMMAND CMD=lube_stamp PARAMS={ax|lower}
	{% endif %}
	RATOS_ECHO PREFIX="LUBE" MSG="{ax} recorded as greased at {total|round(1)} print hours."


[gcode_macro _LUBE_HOURS]
description: Internal use only. Accumulates print time and persists it as lube_print_hours.
variable_last_duration: 0   # internal use only. Do not touch! print_duration at the last sample.
variable_unsaved: 0         # internal use only. Do not touch! Seconds counted but not yet on disk.
variable_interval: 60       # seconds between samples
variable_save_after: 360    # write to disk once this many seconds have piled up
gcode:
	{% set flush = params.FLUSH|default(0)|int %}
	{% set state = (printer.print_stats.state if printer.print_stats is defined else 'standby')|lower %}
	{% set duration = printer.print_stats.print_duration|default(0)|float if printer.print_stats is defined else 0 %}

	# print_duration counts the job in progress and resets when the next one
	# starts, so a value below the last sample means a new job, not lost time.
	{% set delta = (duration - last_duration) if duration >= last_duration else duration %}
	{% set pending = unsaved|float + [delta, 0]|max %}

	SET_GCODE_VARIABLE MACRO=_LUBE_HOURS VARIABLE=last_duration VALUE={duration|round(3)}

	# Writing costs a rewrite of the whole variables file, so it happens once a
	# batch has piled up, or whenever printing stops -- not on every sample.
	{% if pending > 0 and (flush or state != 'printing' or pending >= save_after|float) %}
		{% set total = printer.save_variables.variables.lube_print_hours|default(0)|float + pending / 3600 %}
		SAVE_VARIABLE VARIABLE=lube_print_hours VALUE={total|round(4)}
		SET_GCODE_VARIABLE MACRO=_LUBE_HOURS VARIABLE=unsaved VALUE=0
	{% else %}
		SET_GCODE_VARIABLE MACRO=_LUBE_HOURS VARIABLE=unsaved VALUE={pending|round(3)}
	{% endif %}


[delayed_gcode _LUBE_HOURS_TICK]
initial_duration: 30
gcode:
	# Samples print_duration and re-arms itself, for the life of the session.
	# This does not keep the machine awake: idle_timeout measures idleness at
	# the toolhead's move queue, and nothing here queues a move.
	_LUBE_HOURS
	UPDATE_DELAYED_GCODE ID=_LUBE_HOURS_TICK DURATION={printer["gcode_macro _LUBE_HOURS"].interval|int}


[gcode_shell_command lube_stamp]
# Writes the calendar date of a greasing. $1 is the axis, lower case -- Klipper
# appends PARAMS after the command's own arguments, so the placeholder below
# takes $0 and the parameter lands in $1.
command: /bin/sh -c 'mkdir -p "$HOME/printer_data/config/lube" && date "+%Y-%m-%d %H:%M" > "$HOME/printer_data/config/lube/$1.stamp"' lube-stamp
timeout: 5
verbose: False

[gcode_shell_command lube_dates]
# Prints the stamps into the console. LUBE_STATUS cannot read them itself: a
# shell command's output goes to the console and nowhere a macro can reach.
command: /bin/sh -c 'for a in x y z; do f="$HOME/printer_data/config/lube/$a.stamp"; if [ -r "$f" ]; then echo "last greased $a: $(cat "$f")"; else echo "last greased $a: no date recorded"; fi; done' lube-dates
timeout: 5
verbose: True
