# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.
#
# ---------------------------------------------------------------------------
# 600mm size definition for the V-Core 4.1 IDEX.
#
# Values taken from the live machine config (Custom_settings/600_idex.cfg plus
# the overrides in printer.cfg, which win because printer.cfg includes
# RatOS.cfg at the top and its own sections come after).
#
# The axis limits below match what the configurator generates into printer.cfg
# from `bedMargin` in the v-core-4-1-idex-600 printer definition:
#
#   bedMargin.x = [75, 75]   ->  stepper_x     min/endstop -75
#                                dual_carriage max/endstop  675  (600 + 75)
#   bedMargin.y = [1, 65]    ->  stepper_y     min/endstop   -1
#                                stepper_y     max          665  (600 + 65)
#
# This file lives in the stock v-core-4-1-idex directory on purpose: the shared
# template hardcodes `[include RatOS/printers/v-core-4-1-idex/${size}.cfg]`.
# ---------------------------------------------------------------------------

[stepper_x]
position_max: 600
position_endstop: -75
position_min: -75

[dual_carriage]
position_max: 675
position_endstop: 675
position_min: 0

[stepper_y]
position_max: 665
position_min: -1
position_endstop: -1

[stepper_z]
position_max: 655

# NOTE: with a Beacon on T0 the template emits its own [bed_mesh] block *after*
# this include, which overrides mesh_min/mesh_max with 20,20 -> 580,580 (size
# minus the 20mm proximity margins) and speed with 550. Those four values here
# therefore only apply if the Beacon is ever removed - they match the Beacon's
# own contact_mesh_min/max on the running machine. probe_count, mesh_pps, fade
# and algorithm survive, and are the values actually in effect.
#
# There is deliberately no zero_reference_position. With the Beacon, RatOS
# establishes Z=0 per print via a contact probe ("true zero"), re-calibrating
# the model at the same time:
#
#   variable_beacon_contact_start_print_true_zero: True
#   variable_beacon_contact_start_print_true_zero_fuzzy_position: True
#   variable_beacon_contact_start_print_true_zero_fuzzy_radius: 20
#   variable_beacon_contact_calibrate_model_on_true_zero: True
#
# The probe point is randomised within 20mm so no spot wears into the PEI, and
# the point actually used ends up in _START_PRINT_BED_MESH's
# variable_actual_true_zero_position_x/y. A fixed zero_reference_position
# cannot match a point that moves by design, and does not need to: the contact
# model gives an absolute Z=0, not a relative endstop trigger.
#
# mesh_pps: 0,0 is not a downgrade. At 50x50 over 20..580 the points sit ~11mm
# apart, where interpolation adds nothing - but pps 2,2 inflates the matrix to
# 178x178 = 31684 points, which is the CPU case the bed_mesh reactor-yield port
# exists for (docs/TESTPLAN.md, stage 4: `Timer too close` during the scan, and
# SAVE_CONFIG with a large mesh pending).
[bed_mesh]
horizontal_move_z: 2
mesh_min: 50,50
mesh_max: 570,530
probe_count: 50,50
fade_start: 0.2
fade_end: 5
mesh_pps: 0,0
algorithm: bicubic
bicubic_tension: .2

# Measured Z pivot positions of this machine - do not scale these from the
# stock sizes, they are physical to the 600 frame.
[z_tilt]
z_positions:
	-22,8
	300,637
	621,8

points:
	25,20
	580,280
	25,540

# retries/retry_tolerance from the [z_tilt] block in the live RatOS_4.1.cfg.
# The template emits `[z_tilt] speed:` after this include, which only overrides
# `speed` - the keys below survive.
horizontal_move_z: 20
retries: 15
retry_tolerance: 0.006
