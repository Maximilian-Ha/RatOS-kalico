#############################################################################################################
### Four-zone bed control, with an area-selective variant
###
### This machine's bed is one plate over four independent heaters. Klipper only
### knows one of them as [heater_bed]; the other three are [heater_generic]
### sections and nothing drives them on their own.
###
###      y=600  +---------------+---------------+
###             |               |               |
###             |    BED_HL     |    BED_HR     |   rear
###             |               |               |
###      y=300  +---------------+---------------+
###             |               |               |
###             |  heater_bed   |    BED_VR     |   front
###             |               |               |
###      y=0    +---------------+---------------+
###            x=0            x=300           x=600
###
### Two variants, switched with BED_ZONES_MODE and remembered across restarts:
###
###   MODE=ALL    All four zones follow the bed temperature. This is what the
###               machine does today, and it stays the default.
###   MODE=AUTO   Only the zones the print actually sits on are heated. The
###               footprint comes from the slicer, the rest of the plate stays
###               cold and every unused heater is set to 0.
###
### AUTO changes nothing about how you slice or print: START_PRINT picks the
### zones before the bed is heated, M140/M190 route to whatever is selected,
### and the mask is dropped again as soon as the bed is switched off.
###
### READ docs/BED-ZONES.md BEFORE ENABLING AUTO. Two things there decide
### whether this is safe on your machine: the zone-to-heater mapping below is
### an assumption until you have verified it with BED_ZONES_TEST, and a plate
### heated in one corner is not the same thermal state as a plate heated
### evenly.
###
### Install:
###   1. copy this file to ~/printer_data/config/Custom_settings/bed-zones.cfg
###   2. add [include Custom_settings/bed-zones.cfg] to printer.cfg, below the
###      [include RatOS.cfg] line and below every other custom include
###   3. remove whatever macro currently mirrors heater_bed onto BED_VR,
###      BED_HL and BED_HR - two of them fighting over the same heaters is
###      worse than either alone
###   4. FIRMWARE_RESTART, then run BED_ZONES_STATUS
###
### Nothing here is specific to Kalico or to RatOS-Kalico. It is plain
### gcode_macro and runs the same on stock RatOS.
#############################################################################################################


#------------------------------------------------------------------------------------------------------------
# State and configuration. This macro is never called - it only holds variables.
#
# variable_zones     The heaters and the rectangle of bed each one sits under,
#                    in bed coordinates. The key is the heater name exactly as
#                    Klipper knows it. VERIFY THIS WITH BED_ZONES_TEST: if the
#                    mapping is wrong, AUTO heats the wrong quarter of the bed
#                    and the print peels off a cold plate.
# variable_margin    How far outside the printed footprint a zone still counts
#                    as needed, in mm. This is what keeps a part that ends 5mm
#                    short of a zone border from sitting on the cold edge of a
#                    heated zone. Bigger is safer and less efficient.
# variable_always_on Comma separated zones AUTO must always include, whatever
#                    the footprint says. Put the zone your prime blob lands on
#                    here if priming on a cold plate gives you trouble.
#------------------------------------------------------------------------------------------------------------
[gcode_macro _BED_ZONES]
description: State for the four bed heating zones. Holds variables only, do not call.
variable_zones: {
		"heater_bed": {"x": [0, 300], "y": [0, 300]},
		"BED_VR": {"x": [300, 600], "y": [0, 300]},
		"BED_HL": {"x": [0, 300], "y": [300, 600]},
		"BED_HR": {"x": [300, 600], "y": [300, 600]}
	}
variable_margin: 40
variable_always_on: ""
variable_poll_interval: 2
variable_mode: "all"
variable_active: "heater_bed,BED_VR,BED_HL,BED_HR"
variable_target: 0
variable_bed_seen: 0
variable_waiting: False
gcode:
	BED_ZONES_STATUS


#------------------------------------------------------------------------------------------------------------
# Apply the stored target to the active zones, and 0 to every other zone.
#
# This is the only place a bed heater target is written. It also records what
# it left on heater_bed, so the poll below can tell an outside change from its
# own work.
#------------------------------------------------------------------------------------------------------------
[gcode_macro _BED_ZONES_APPLY]
description: Push the stored bed target onto the active zones. Internal, do not call.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set target = st.target|float|round(0)|int %}
	{% set active = st.active.split(",") %}
	{% for name in st.zones.keys() %}
		{% set wanted = target if name in active else 0 %}
		{% if name == "heater_bed" %}
			SET_HEATER_TEMPERATURE HEATER="heater_bed" TARGET={wanted}
		{% elif printer["heater_generic " ~ name] is defined %}
			SET_HEATER_TEMPERATURE HEATER="{name}" TARGET={wanted}
		{% endif %}
	{% endfor %}
	SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=bed_seen VALUE={target if "heater_bed" in active else 0}


#------------------------------------------------------------------------------------------------------------
# Wait for the active zones to reach temperature.
#
# heater_bed goes through the renamed M190 so the interface still shows the
# usual "heating bed" state. The generic zones have no M190, so they are waited
# on with TEMPERATURE_WAIT. MINIMUM is one degree under target because a PID
# heater can settle just below its setpoint and TEMPERATURE_WAIT, unlike M190,
# has no settle window of its own - waiting for the exact value can hang.
#------------------------------------------------------------------------------------------------------------
[gcode_macro _BED_ZONES_WAIT]
description: Wait for every active bed zone to reach temperature. Internal, do not call.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set target = params.TEMP|default(st.target)|float|round(0)|int %}
	{% set active = st.active.split(",") %}
	{% if target > 0 %}
		SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=waiting VALUE=True
		{% for name in active %}
			{% if name == "heater_bed" %}
				M190.1 S{target}
			{% elif printer["heater_generic " ~ name] is defined %}
				TEMPERATURE_WAIT SENSOR="heater_generic {name}" MINIMUM={target - 1}
			{% endif %}
		{% endfor %}
		SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=waiting VALUE=False
	{% endif %}


#------------------------------------------------------------------------------------------------------------
# Set the bed temperature. Only the active zones get it.
#
# TEMP=0 also drops an automatic zone selection, so the next heat-up from the
# interface warms the whole plate again rather than silently reusing the mask
# of the print that just finished.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_SET]
description: Set the bed temperature. Only the currently active zones are heated.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set target = params.TEMP|default(params.S)|default(0)|float|round(0)|int %}
	SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=waiting VALUE=False
	SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=target VALUE={target}
	{% if target <= 0 and st.mode|lower == "auto" %}
		SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=active VALUE="'{st.zones.keys()|join(',')}'"
	{% endif %}
	_BED_ZONES_APPLY
	{% if target > 0 and st.active.split(",")|length < st.zones|length %}
		{action_respond_info("Bed zones: %s heating to %d C, the rest of the bed stays off." % (st.active, target))}
	{% endif %}


[gcode_macro BED_ZONES_OFF]
description: Switch every bed zone off and drop an automatic zone selection.
gcode:
	BED_ZONES_SET TEMP=0


#------------------------------------------------------------------------------------------------------------
# Choose which zones are heated. ZONES=all, or a comma separated list of
# heater names. The stored target is re-applied immediately, so this works
# while the bed is hot.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_SELECT]
description: Choose which bed zones are heated. ZONES=all or a comma separated list of heaters.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set requested = params.ZONES|default("all")|string %}
	{% if requested|lower == "all" %}
		{% set names = st.zones.keys()|list %}
	{% else %}
		{% set names = requested.split(",")|map("trim")|select|list %}
		{% for name in names %}
			{% if name not in st.zones %}
				{action_raise_error("BED_ZONES_SELECT: '%s' is not a bed zone. Known zones: %s" % (name, st.zones.keys()|join(', ')))}
			{% endif %}
		{% endfor %}
		{% if names|length == 0 %}
			{action_raise_error("BED_ZONES_SELECT: ZONES is empty. Use ZONES=all to heat the whole bed.")}
		{% endif %}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=active VALUE="'{names|join(',')}'"
	_BED_ZONES_APPLY


#------------------------------------------------------------------------------------------------------------
# Pick the zones a print needs, from the area it covers.
#
# Sources, in the order they are trusted:
#
#   1. MIN_X/MIN_Y/MAX_X/MAX_Y passed to this macro.
#   2. X0/Y0/X1/Y1, which RatOS' START_PRINT already receives from the slicer.
#      These are the adaptive bed mesh bounds: the whole printed area, wipe
#      tower included.
#   3. The bounding box over all [exclude_object] polygons, if the slicer
#      labels objects. One box over everything, not one per object - a prime
#      blob and a wipe tower are not objects and would fall outside a
#      per-object selection.
#   4. Nothing usable: heat the whole bed and say so.
#
# IDEX copy and mirror mode always heat the whole bed. The gcode is transformed
# after this point, so the coordinates the slicer reported are not where the
# second toolhead will print.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_AUTO]
description: Select the bed zones the print covers. Takes MIN_X/MIN_Y/MAX_X/MAX_Y or START_PRINT's X0/Y0/X1/Y1.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set margin = params.MARGIN|default(st.margin)|float %}
	{% set always_on = st.always_on.split(",")|map("trim")|select|list %}
	{% set box = namespace(x0=0, y0=0, x1=0, y1=0, source="") %}

	{% set idex_mode = printer["dual_carriage"].carriage_1|lower if printer["dual_carriage"] is defined else "" %}

	{% if params.MIN_X is defined and params.MIN_Y is defined and params.MAX_X is defined and params.MAX_Y is defined %}
		{% set box.x0 = params.MIN_X|float %}
		{% set box.y0 = params.MIN_Y|float %}
		{% set box.x1 = params.MAX_X|float %}
		{% set box.y1 = params.MAX_Y|float %}
		{% set box.source = "parameters" %}
	{% elif params.X0 is defined and params.Y0 is defined and params.X1 is defined and params.Y1 is defined and params.X0|float >= 0 and params.Y0|float >= 0 and params.X1|float > params.X0|float and params.Y1|float > params.Y0|float %}
		{% set box.x0 = params.X0|float %}
		{% set box.y0 = params.Y0|float %}
		{% set box.x1 = params.X1|float %}
		{% set box.y1 = params.Y1|float %}
		{% set box.source = "slicer print area" %}
	{% elif printer.exclude_object is defined and printer.exclude_object.objects|default([])|length > 0 %}
		{% set hull = namespace(x0=1e9, y0=1e9, x1=-1e9, y1=-1e9, complete=true) %}
		{% for obj in printer.exclude_object.objects %}
			{% if obj.polygon is defined and obj.polygon|length > 0 %}
				{% for point in obj.polygon %}
					{% set hull.x0 = [hull.x0, point[0]|float]|min %}
					{% set hull.y0 = [hull.y0, point[1]|float]|min %}
					{% set hull.x1 = [hull.x1, point[0]|float]|max %}
					{% set hull.y1 = [hull.y1, point[1]|float]|max %}
				{% endfor %}
			{% else %}
				{% set hull.complete = false %}
			{% endif %}
		{% endfor %}
		{% if hull.complete and hull.x1 > hull.x0 and hull.y1 > hull.y0 %}
			{% set box.x0 = hull.x0 %}
			{% set box.y0 = hull.y0 %}
			{% set box.x1 = hull.x1 %}
			{% set box.y1 = hull.y1 %}
			{% set box.source = "exclude_object outlines" %}
		{% endif %}
	{% endif %}

	{% if idex_mode in ("copy", "mirror") %}
		{action_respond_info("Bed zones: IDEX %s mode prints outside the reported area, heating the whole bed." % idex_mode)}
		BED_ZONES_SELECT ZONES=all
	{% elif box.source == "" %}
		{action_respond_info("Bed zones: no print area reported by the slicer, heating the whole bed. See docs/BED-ZONES.md.")}
		BED_ZONES_SELECT ZONES=all
	{% else %}
		{% set sel = namespace(names=[]) %}
		{% for name, zone in st.zones.items() %}
			{% set overlaps = (box.x0 - margin) < zone.x[1] and (box.x1 + margin) > zone.x[0] and (box.y0 - margin) < zone.y[1] and (box.y1 + margin) > zone.y[0] %}
			{% if overlaps or name in always_on %}
				{% set sel.names = sel.names + [name] %}
			{% endif %}
		{% endfor %}
		{% if sel.names|length == 0 %}
			{action_respond_info("Bed zones: the print area %.0f,%.0f - %.0f,%.0f is not over any zone, heating the whole bed." % (box.x0, box.y0, box.x1, box.y1))}
			BED_ZONES_SELECT ZONES=all
		{% else %}
			{action_respond_info("Bed zones: print area %.0f,%.0f - %.0f,%.0f from %s, margin %.0fmm, heating %s." % (box.x0, box.y0, box.x1, box.y1, box.source, margin, sel.names|join(', ')))}
			BED_ZONES_SELECT ZONES={sel.names|join(',')}
		{% endif %}
	{% endif %}


#------------------------------------------------------------------------------------------------------------
# ALL or AUTO. Stored in the variables file, so it survives a restart.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_MODE]
description: Switch bed heating between MODE=ALL (whole bed) and MODE=AUTO (only the printed area).
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set mode = params.MODE|default("")|string|lower %}
	{% if mode not in ("all", "auto") %}
		{action_raise_error("BED_ZONES_MODE: MODE must be ALL or AUTO, got '%s'." % params.MODE|default(""))}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=mode VALUE="'{mode}'"
	{% if printer.save_variables is defined %}
		SAVE_VARIABLE VARIABLE=bed_zones_mode VALUE="'{mode}'"
	{% endif %}
	{% if mode == "all" %}
		BED_ZONES_SELECT ZONES=all
		{action_respond_info("Bed zones: mode ALL, the whole bed follows the bed temperature.")}
	{% else %}
		{action_respond_info("Bed zones: mode AUTO, the next print heats only the area it covers.")}
	{% endif %}


#------------------------------------------------------------------------------------------------------------
# Heat exactly one zone, to check that the mapping above matches the hardware.
# Run this once per zone with a cold bed and feel where the plate gets warm.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_TEST]
description: Heat a single bed zone to check the zone-to-heater mapping. ZONE=<heater> [TEMP=50]
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set zone = params.ZONE|default("")|string %}
	{% set temp = params.TEMP|default(50)|float|round(0)|int %}
	{% if zone not in st.zones %}
		{action_raise_error("BED_ZONES_TEST: ZONE must be one of %s." % st.zones.keys()|join(', '))}
	{% endif %}
	BED_ZONES_SELECT ZONES={zone}
	BED_ZONES_SET TEMP={temp}
	{action_respond_info("Bed zones: heating %s only, to %d C. It should warm the bed area x %d-%d, y %d-%d. Run BED_ZONES_OFF when you are done." % (zone, temp, st.zones[zone].x[0], st.zones[zone].x[1], st.zones[zone].y[0], st.zones[zone].y[1]))}


[gcode_macro BED_ZONES_STATUS]
description: Report the bed zone mode, the active zones and every zone temperature.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set active = st.active.split(",") %}
	{action_respond_info("Bed zones: mode %s, requested %d C, active: %s" % (st.mode|upper, st.target|float|round(0)|int, st.active))}
	{% for name, zone in st.zones.items() %}
		{% if name == "heater_bed" %}
			{% set heater = printer.heater_bed %}
		{% else %}
			{% set heater = printer["heater_generic " ~ name]|default(none) %}
		{% endif %}
		{% if heater %}
			{action_respond_info("  %-10s x %3d-%3d  y %3d-%3d  %5.1f C -> %3d C  %s" % (name, zone.x[0], zone.x[1], zone.y[0], zone.y[1], heater.temperature, heater.target, "on" if name in active else "off"))}
		{% else %}
			{action_respond_info("  %-10s MISSING - no such heater in this configuration" % name)}
		{% endif %}
	{% endfor %}


#------------------------------------------------------------------------------------------------------------
# START_PRINT hook. RatOS calls _USER_START_PRINT with the slicer's parameters
# before it heats the bed, which is exactly where the zone selection belongs.
#
# If you already define _USER_START_PRINT somewhere else, delete the section
# below and call BED_ZONES_START_PRINT { rawparams } from your own hook - two
# sections of the same name would merge, and the last gcode: block wins.
#------------------------------------------------------------------------------------------------------------
[gcode_macro BED_ZONES_START_PRINT]
description: Select the bed zones for the print that is starting. Call from _USER_START_PRINT.
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% if st.mode|lower == "auto" %}
		BED_ZONES_AUTO {rawparams}
	{% else %}
		BED_ZONES_SELECT ZONES=all
	{% endif %}

[gcode_macro _USER_START_PRINT]
gcode:
	BED_ZONES_START_PRINT {rawparams}


#------------------------------------------------------------------------------------------------------------
# M140/M190 route the bed temperature through the zone selection.
#
# RatOS' START_PRINT heats the bed with M190, and every slicer emits M140/M190,
# so this is the one place that catches all of them. Neither is overridden by
# RatOS itself.
#------------------------------------------------------------------------------------------------------------
[gcode_macro M140]
rename_existing: M140.1
description: Set bed temperature, on the active bed zones only.
gcode:
	BED_ZONES_SET TEMP={params.S|default(0)|float|round(0)|int}

[gcode_macro M190]
rename_existing: M190.1
description: Set and wait for bed temperature, on the active bed zones only.
gcode:
	{% set target = params.S|default(0)|float|round(0)|int %}
	BED_ZONES_SET TEMP={target}
	_BED_ZONES_WAIT TEMP={target}


#------------------------------------------------------------------------------------------------------------
# The interface does not send M140. Mainsail, Fluidd and Moonraker set a bed
# temperature with SET_HEATER_TEMPERATURE, and TURN_OFF_HEATERS bypasses this
# file entirely. So the zones also follow heater_bed by observation:
#
#   - heater_bed's target changed behind our back  -> adopt it as the new
#     bed temperature and re-apply the current zone selection
#   - an active zone was set to 0 behind our back  -> somebody switched the
#     bed off (TURN_OFF_HEATERS, or the zone's own slider), so switch the
#     rest off too rather than quietly re-heating it
#
# Nothing is written unless one of those two is true, so this costs one
# template render every couple of seconds and no gcode.
#------------------------------------------------------------------------------------------------------------
[delayed_gcode _BED_ZONES_POLL]
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set bed_now = printer.heater_bed.target|float|round(0)|int %}
	{% set active = st.active.split(",") %}
	{% if bed_now != st.bed_seen|float|round(0)|int %}
		BED_ZONES_SET TEMP={bed_now}
	{% elif st.target|float|round(0)|int > 0 and not st.waiting %}
		{% set ns = namespace(switched_off=false) %}
		{% for name in active %}
			{% if name != "heater_bed" and printer["heater_generic " ~ name] is defined %}
				{% if printer["heater_generic " ~ name].target|float|round(0)|int == 0 %}
					{% set ns.switched_off = true %}
				{% endif %}
			{% endif %}
		{% endfor %}
		{% if ns.switched_off %}
			BED_ZONES_OFF
		{% endif %}
	{% endif %}
	UPDATE_DELAYED_GCODE ID=_BED_ZONES_POLL DURATION={st.poll_interval|float}


[delayed_gcode _BED_ZONES_INIT]
initial_duration: 3
gcode:
	{% set st = printer["gcode_macro _BED_ZONES"] %}
	{% set missing = [] %}
	{% for name in st.zones.keys() %}
		{% if name != "heater_bed" and printer["heater_generic " ~ name] is not defined %}
			{% if missing.append(name) %}{% endif %}
		{% endif %}
	{% endfor %}
	{% if missing|length > 0 %}
		{action_respond_info("Bed zones: %s in variable_zones has no matching heater and will be ignored. Fix the zone table in bed-zones.cfg." % missing|join(', '))}
	{% endif %}
	{% if printer.save_variables is defined %}
		{% set saved = printer.save_variables.variables.bed_zones_mode|default("all")|string|lower %}
		{% if saved in ("all", "auto") and saved != st.mode|lower %}
			SET_GCODE_VARIABLE MACRO=_BED_ZONES VARIABLE=mode VALUE="'{saved}'"
			{action_respond_info("Bed zones: mode %s restored." % saved|upper)}
		{% endif %}
	{% endif %}
	UPDATE_DELAYED_GCODE ID=_BED_ZONES_POLL DURATION={st.poll_interval|float}
