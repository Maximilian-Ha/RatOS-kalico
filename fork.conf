#
# RatOS-Kalico — single source of truth for the fork's identity.
#
# Every build and install script reads this file. Nothing else hardcodes a
# repository URL or a branch name, so re-pointing the fork at a different
# account is a one-file change.
#
# shellcheck disable=SC2034

# ---------------------------------------------------------------------------
# Upstreams we track. Change these only to follow a different upstream.
# ---------------------------------------------------------------------------

# Kalico — replaces Rat-OS/klipper as the firmware base.
UPSTREAM_KALICO_URL="https://github.com/KalicoCrew/kalico.git"
UPSTREAM_KALICO_BRANCH="main"

# RatOS configurator — owns configuration/, the klippy extensions and every
# update script. This is the repository RatOS updates actually flow through.
UPSTREAM_CONFIGURATOR_URL="https://github.com/Rat-OS/RatOS-configurator.git"
UPSTREAM_CONFIGURATOR_BRANCH="v2.1.x"

# The exact upstream commits this fork's patches were written and verified
# against. build-*.sh warns loudly when the upstream tip has moved past them,
# because a moved anchor is how a patch silently half-applies.
VERIFIED_KALICO_COMMIT="ae261624f57fb597dcffaa46062b1c58d3e5999d"
VERIFIED_CONFIGURATOR_COMMIT="26d261742157103e166e6879cd9dead37cf2cc42"

# ---------------------------------------------------------------------------
# The fork's own repositories. These must exist and be pushable before
# scripts/install.sh can point a printer at them.
# ---------------------------------------------------------------------------

# The Kalico fork that becomes ~/klipper on the printer.
FORK_KALICO_URL="https://github.com/Maximilian-Ha/kalico.git"
FORK_KALICO_BRANCH="ratos-kalico/v2.1.x"

# Moonraker's built-in klipper updater cannot be told which branch to use --
# primary_branch is not overridable and defaults to "master" (moonraker
# git_deploy.py). Its Recover and Hard Recover buttons therefore check out, and
# in the hard case clone, "master". The build script publishes this alias
# branch alongside FORK_KALICO_BRANCH, pointing at the same commit, so those
# buttons cannot strand a printer on unrelated code.
FORK_KALICO_RECOVERY_BRANCH="master"

# The configurator fork. RatOS updates are pulled from the deployment branch,
# which carries a built Next.js app -- not from the source branch.
FORK_CONFIGURATOR_URL="https://github.com/Maximilian-Ha/RatOS-configurator.git"
FORK_CONFIGURATOR_BRANCH="v2.1.x-kalico"
FORK_CONFIGURATOR_DEPLOYMENT_BRANCH="v2.1.x-kalico-deployment"

# ---------------------------------------------------------------------------
# On-printer paths. Overridable for testing against a checkout that is not a
# real RatOS installation.
# ---------------------------------------------------------------------------

KLIPPER_DIR="${KLIPPER_DIR:-$HOME/klipper}"
CONFIGURATOR_DIR="${CONFIGURATOR_DIR:-$HOME/ratos-configurator}"
PRINTER_DATA_DIR="${PRINTER_DATA_DIR:-$HOME/printer_data}"
